<section class="pb-16 bg-gray-100">
  <div class="container xl:w-[95%]">
    <h2 class="text-2xl text-green-600 font-medium mb-6">Shop Popular Categories</h2>
    <owl-carousel-o [options]="categoriesOptions">
      @for (item of categoriesList(); track item._id) {
        <ng-template carouselSlide [id]="item._id">
          <div>
            <img class="w-full h-75" [src]="item.image" [alt]="item.name" [title]="item.name" />
            <h3 class="text-green-600 pt-1">{{ item.name }}</h3>
          </div>
        </ng-template>
      }
    </owl-carousel-o>
  </div>
</section>
